<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather - Screenly Edge App</title>
    <script src="screenly.js?version=1"></script>
  </head>
  <body
    class="text-white text-shadow bg-[url('/static/images/bg-sunny.webp')] bg-no-repeat bg-center bg-cover before:content-[''] before:fixed before:inset-0 before:z-[var(--z-index-backdrop)] before:pointer-events-none before:bg-black/[0.05] before:backdrop-blur-[7px]"
  >
    <auto-scaler
      reference-width="1920"
      reference-height="1080"
      orientation="auto"
      class="relative z-[var(--z-index-content)]"
    >
      <div id="app" class="w-full h-full">
        <app-header class="header" show-date></app-header>

        <main class="content">
          <section
            class="absolute left-[320px] top-[230px] portrait:left-[60px] portrait:top-[200px] flex flex-col gap-2"
          >
            <div
              class="text-[2rem] portrait:text-[2.5rem] font-normal tracking-[-0.04em]"
              data-location
            >
              --
            </div>
            <div
              class="text-[7.5rem] portrait:text-[9rem] font-normal leading-none"
              data-temperature
            >
              --°
            </div>
            <div
              class="inline-flex items-center justify-between px-4 py-1 h-[2.4375rem] portrait:text-[1.5rem] rounded-2xl border-[1.68px] border-white/[0.06] bg-[linear-gradient(172deg,rgba(255,255,255,0.06)_0%,rgba(255,255,255,0.01)_100%)] shadow-[0_13.438px_40.315px_0_rgba(0,0,0,0.15),0_1.68px_0_0_rgba(255,255,255,0.1)_inset,0_-1.68px_0_0_rgba(255,255,255,0.03)_inset] w-fit gap-8"
            >
              <span
                class="text-[1rem] font-medium tracking-[-0.04em]"
                data-weather-description
              ></span>
              <div class="flex items-center gap-2.5">
                <span
                  class="flex items-center gap-1 text-[1rem] font-medium tracking-[-0.04em]"
                  >↑ <span data-temp-high>--°</span></span
                >
                <span
                  class="flex items-center gap-1 text-[1rem] font-medium tracking-[-0.04em]"
                  >↓ <span data-temp-low>--°</span></span
                >
              </div>
            </div>
          </section>

          <section
            class="absolute left-1/2 -translate-x-1/2 top-[598px] portrait:top-auto portrait:bottom-[60px] w-[1280px] portrait:w-[calc(100%-120px)] h-[269px] portrait:h-auto portrait:pb-6 rounded-2xl border-[1.054px] border-white/10 bg-[linear-gradient(106deg,rgba(255,255,255,0.09)_3%,rgba(255,255,255,0.01)_100%)] backdrop-blur-[31.63px] shadow-[0_1px_0_0_rgba(255,255,255,0.15)_inset,0_-1px_0_0_rgba(255,255,255,0.05)_inset]"
            data-forecast-card
          >
            <div class="flex items-center gap-2 pt-[1.3rem] px-6 pb-0">
              <img
                class="w-[1.05rem] h-[1.05rem]"
                data-forecast-header-icon
                alt=""
              />
              <span
                class="text-[1.05rem] font-normal uppercase tracking-[0.037rem] text-white/70"
                >Forecast by Hour</span
              >
            </div>
            <div class="mt-3 mx-6 mb-0 h-px bg-[#d9d9d9] opacity-20"></div>
            <div
              class="flex items-center justify-between pt-4 px-6 pb-0"
              data-forecast-items
            ></div>
          </section>
        </main>

        <div
          id="error-screen"
          class="hidden absolute inset-0 flex items-center justify-center p-12 portrait:py-6 portrait:px-8 z-10"
        >
          <div
            class="flex flex-row portrait:flex-col overflow-hidden max-w-[60rem] portrait:max-w-full w-full rounded-2xl border-[1.054px] border-white/10 bg-[linear-gradient(106deg,rgba(255,255,255,0.09)_3%,rgba(255,255,255,0.01)_100%)] backdrop-blur-[31.63px] shadow-[0_1px_0_0_rgba(255,255,255,0.15)_inset,0_-1px_0_0_rgba(255,255,255,0.05)_inset]"
          >
            <div
              class="bg-white/[0.08] border-r border-white/10 portrait:border-r-0 portrait:border-b py-10 px-8 flex flex-col justify-start gap-4 flex-[0_0_20rem] portrait:flex-none"
            >
              <h2
                class="text-[2rem] font-bold leading-[1.2] tracking-[-0.03em] text-white/95 m-0 text-shadow-none"
              >
                Something went wrong
              </h2>
              <p
                class="text-[1.25rem] text-white/85 leading-[1.6] m-0 text-shadow-none"
              >
                The weather data could not be loaded. Please check your
                configuration or contact your administrator.
              </p>
            </div>
            <div class="flex-1 py-10 px-8 flex flex-col justify-start gap-3">
              <div
                class="text-xs font-semibold text-white/50 uppercase tracking-[0.08em] text-shadow-none"
              >
                Error details
              </div>
              <p
                id="error-message"
                class="text-[1.25rem] text-white/85 leading-[1.6] break-words m-0 text-shadow-none"
              ></p>
            </div>
          </div>
        </div>
      </div>
    </auto-scaler>

    <template id="forecast-item-template">
      <div
        class="forecast-item group flex flex-col items-center gap-6 flex-none [&:not(:first-child)]:opacity-80"
      >
        <span
          class="forecast-item-temp text-[1.625rem] portrait:text-[2rem] font-medium"
        ></span>
        <img
          class="forecast-item-icon w-[4.5rem] h-[4.5rem] portrait:w-[5rem] portrait:h-[5rem] object-contain"
          alt=""
        />
        <span
          class="forecast-item-time text-[1.3rem] portrait:text-[1.5rem] font-medium text-center whitespace-nowrap group-[:not(:first-child)]:text-[#e9e9e9]"
        >
          <span class="forecast-item-time-value"></span>
          <span class="forecast-item-time-period portrait:hidden"></span>
        </span>
      </div>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
